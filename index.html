<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>ระบบจัดการ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #080f1d;
      font-family: 'Kanit', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .frame-wrapper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* ซ่อนแถบสีเทาด้านบนของ Google Apps Script อัตโนมัติกรณีเปิดผ่านโหมด Iframe สำรอง */
    iframe.crop-gas-bar {
      top: -68px;
      height: calc(100% + 68px);
    }
    @media (min-width: 768px) {
      iframe.crop-gas-bar {
        top: -54px;
        height: calc(100% + 54px);
      }
    }
  </style>
</head>
<body>
  <div class="frame-wrapper" id="frameWrap">
    <iframe id="appFrame" allow="autoplay; camera *; microphone *; clipboard-read; clipboard-write; display-capture"></iframe>
  </div>

  <script>
    // 1. URL ร้านชาบู
    const SHABU_URL = "https://script.google.com/macros/s/AKfycbynNg5wbR8JwHeumgDj44FDe7TCk0ESO3k5HJSRK0VNY5aRtCyEzTqUT9fATV-Vp9tm/exec";
    
    // 2. URL ห้องเรียน Aaron Smart Classroom (English & Japanese - แยกเฉพาะของ Aaron)
    const AARON_URL = "https://script.google.com/macros/s/AKfycbyHp3DEmTj5St_X-OgvhRzP2sEfQx58dtFuV-cLBQYkJkegpZ37pozLtzzF59so1DqF/exec";

    // 3. URL ห้องเรียนสังคมคาเฟ่ คุณครูพิชามญ คงมีผล (โรงเรียนบ้านหุบกระทิง จ.ราชบุรี - แยกเฉพาะของครูพิชามญ)
    const PICHAMON_URL = "https://script.google.com/macros/s/AKfycbwQscZsFfHLByOeRMV4b3EhkaE0a5TUH7AKGoK_U_C9mQn_51cf-pXAI3whcEmC3E_q/exec";

    // 4. URL ห้องเรียน Dang Smart Classroom (คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล)
    const DANG_URL = "https://script.google.com/macros/s/AKfycbzBR6_q49HMH7SnmhpipeTuWOa_8ddW0Q_tcuAFT2QqTr-ls6ljqTLvC92z8lVMydi1/exec";

    // 5. URL ระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4 (Quick and Easy Exam)
    const EXAM_URL = "https://script.google.com/macros/s/AKfycbygta_D0T2FB7_cWZTIcwjpvrFftBBhZiz8WJ9lnT-F-bILz3-DhG3gHTNqOy1_iP3dmw/exec";

    // 6. URL ระบบบริหารจัดการสถานศึกษาดิจิทัลไร้ต้นทุน (School ERP Enterprise 2569)
    const ERP_URL = "https://script.google.com/macros/s/AKfycbybJSlccZExasgBc248eU_CYXdGKGIUxgelowhLTepj82In1izUQMIePKLY3Mpa1xLFRA/exec";

    // ฟังก์ชันแยกเส้นทาง (Generated via Local AI Builder - Qwen 2.5 Coder 3B)
    function getRouteFlags(searchStr) {
      const params = new URLSearchParams(searchStr);
      const app = (params.get("app") || "").toLowerCase();
      const erpKeywords = ["erp", "school", "office", "sarabun"];
      const examKeywords = ["exam", "quiz", "test"];
      const dangKeywords = ["dang", "math"];
      const pichamonKeywords = ["social", "pichamon", "cafe"];
      const aaronKeywords = ["class", "aaron", "sid"];

      return {
        params,
        isErp: erpKeywords.some(k => params.has(k)) || erpKeywords.includes(app),
        isExam: examKeywords.some(k => params.has(k)) || examKeywords.includes(app),
        isDang: dangKeywords.some(k => params.has(k)) || dangKeywords.includes(app),
        isPichamon: pichamonKeywords.some(k => params.has(k)) || pichamonKeywords.includes(app),
        isAaron: aaronKeywords.some(k => params.has(k)) || aaronKeywords.includes(app)
      };
    }

    const { params, isErp, isExam, isDang, isPichamon, isAaron } = getRouteFlags(window.location.search);

    function bootStandaloneShell(targetUrl, shellKey, expectedMarker, dataKey) {
      function writeShell(htmlStr) {
        document.open();
        document.write(htmlStr);
        document.close();
      }

      function fallbackToIframe() {
        const frame = document.getElementById("appFrame");
        if (frame) {
          frame.classList.add("crop-gas-bar");
          frame.src = targetUrl + window.location.search;
        }
      }

      function fetchAndCacheShell(isBackground) {
        fetch(targetUrl + "?action=standalone_html", { redirect: "follow" })
          .then(r => r.json())
          .then(res => {
            if (res && res.status === "SUCCESS" && res.html) {
              try { localStorage.setItem(shellKey, res.html); } catch (e) {}
              if (res.data && dataKey) {
                try {
                  window.__INITIAL_EXAM_DATA__ = res.data;
                  localStorage.setItem(dataKey, JSON.stringify(res.data));
                } catch (e) {}
              }
              if (!isBackground) {
                writeShell(res.html);
              }
            } else if (!isBackground) {
              fallbackToIframe();
            }
          })
          .catch(() => {
            if (!isBackground) {
              fallbackToIframe();
            }
          });
      }

      let cachedShell = null;
      try { cachedShell = localStorage.getItem(shellKey); } catch (e) {}

      if (cachedShell && cachedShell.includes(expectedMarker)) {
        setTimeout(() => fetchAndCacheShell(true), 1200);
        writeShell(cachedShell);
      } else {
        fetchAndCacheShell(false);
      }
    }

    if (isErp && !params.has("iframe")) {
      // ⚡ โหมด Standalone สำหรับ School ERP Enterprise 2569 (?erp=1 หรือ ?school=1)
      document.title = "School ERP Enterprise 2569 — ระบบบริหารจัดการสถานศึกษาดิจิทัลไร้ต้นทุน";
      document.body.style.backgroundColor = "#f8fafc";
      bootStandaloneShell(ERP_URL, "school_erp_standalone_shell_v1", "SCHOOL ERP ENTERPRISE SYSTEM", "school_erp_swr_cache_v1");
    } else if (isExam && !params.has("iframe")) {
      // ⚡ โหมด Standalone สำหรับระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4
      document.title = "ระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4";
      document.body.style.backgroundColor = "#f0f4f9";
      bootStandaloneShell(EXAM_URL, "exam_standalone_shell_v1", "QUICK AND EASY EXAM SYSTEM", "exam_appdata_swr_v1");
    } else if (isDang && !params.has("iframe")) {
      // ⚡ โหมด Standalone สำหรับ Dang Smart Classroom 360°
      document.title = "SMART CLASSROOM 360° : คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล";
      document.body.style.backgroundColor = "#001838";
      bootStandaloneShell(DANG_URL, "dang_standalone_shell_v1", "DANG SMART CLASSROOM");
    } else if (isPichamon && !params.has("iframe")) {
      // ⚡ โหมด Standalone สำหรับ ห้องเรียนสังคมคาเฟ่ คุณครูพิชามญ คงมีผล (?social=1 หรือ ?pichamon=1)
      document.title = "🍵 ห้องเรียนสังคมคาเฟ่ คุณครูพิชามญ คงมีผล 🌸 โรงเรียนบ้านหุบกระทิง จ.ราชบุรี";
      document.body.style.backgroundColor = "#fff9f5";
      bootStandaloneShell(PICHAMON_URL, "pichamon_cafe_shell_v3", "คุณครูพิชามญ คงมีผล");
    } else if (isAaron && !params.has("iframe")) {
      // ⚡ โหมด Standalone สำหรับ Aaron Smart Classroom (?class=1 หรือ ?aaron=1)
      document.title = "🇬🇧🇯🇵 Aaron Smart Classroom — Tokyo–London Language Arcade";
      document.body.style.backgroundColor = "#f0f7ff";
      try {
        localStorage.removeItem("aaron_standalone_shell_v1");
        localStorage.removeItem("aaron_standalone_shell_v2");
      } catch (e) {}
      bootStandaloneShell(AARON_URL, "aaron_neopop_shell_v3", "NEO-POP LANGUAGE ARCADE");
    } else {
      let targetUrl = SHABU_URL;
      const frame = document.getElementById("appFrame");
      if (isErp) {
        document.title = "School ERP Enterprise 2569 — ระบบบริหารจัดการสถานศึกษาดิจิทัลไร้ต้นทุน";
        document.body.style.backgroundColor = "#f8fafc";
        if (frame) frame.classList.add("crop-gas-bar");
        targetUrl = ERP_URL;
      } else if (isExam) {
        document.title = "ระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4";
        document.body.style.backgroundColor = "#f0f4f9";
        if (frame) frame.classList.add("crop-gas-bar");
        targetUrl = EXAM_URL;
      } else if (isDang) {
        document.title = "SMART CLASSROOM 360° : คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล";
        document.body.style.backgroundColor = "#001838";
        targetUrl = DANG_URL;
      } else if (isPichamon) {
        document.title = "🍵 ห้องเรียนสังคมคาเฟ่ คุณครูพิชามญ คงมีผล 🌸 โรงเรียนบ้านหุบกระทิง จ.ราชบุรี";
        document.body.style.backgroundColor = "#fff9f5";
        targetUrl = PICHAMON_URL;
      } else if (isAaron) {
        document.title = "Aaron Smart Classroom — English & Japanese";
        targetUrl = AARON_URL;
      } else {
        document.title = "ชาบู - ระบบจัดการร้าน";
        targetUrl = SHABU_URL;
      }
      if (frame) frame.src = targetUrl + window.location.search;
    }
  </script>
</body>
</html>
