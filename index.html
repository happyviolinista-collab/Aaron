<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจัดการ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #0b0b0c;
    }
    .frame-wrapper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden;
    }
    /* บนมือถือ แถบสีเทาของ Google ซ้อน 2 บรรทัดสูง 70px จึงต้องดันขึ้น -70px */
    iframe {
      position: absolute;
      top: -70px;
      left: 0;
      width: 100%;
      height: calc(100% + 70px);
      border: none;
      display: block;
    }
    /* บนหน้าจอคอมพิวเตอร์ เป็นบรรทัดเดียว ดันขึ้น -55px */
    @media (min-width: 768px) {
      iframe {
        top: -55px;
        height: calc(100% + 55px);
      }
    }
  </style>
</head>
<body>
  <div class="frame-wrapper">
    <iframe id="appFrame" allow="autoplay; camera; microphone"></iframe>
  </div>

  <script>
    // 1. URL ร้านชาบู
    const SHABU_URL = "https://script.google.com/macros/s/AKfycbynNg5wbR8JwHeumgDj44FDe7TCk0ESO3k5HJSRK0VNY5aRtCyEzTqUT9fATV-Vp9tm/exec";
    
    // 2. URL ห้องเรียน Aaron Smart Classroom
    const CLASS_URL = "https://script.google.com/macros/s/AKfycbwEJCEFJ5MU69n9R3MeHtQSYMGPRC2Gncma_G1DoFT9oco8uScv80vVXjOsuOuH4KaP/exec";

    // 3. URL ห้องเรียน Dang Smart Classroom (คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล)
    const DANG_URL = "https://script.google.com/macros/s/AKfycbwifzXPOLALRkmbJtmb-VY6vR-5pUuIBh1zIN_veZ6lmLJMsACB6g3rZjDOeK6cTWua/exec";

    // ตรวจสอบพารามิเตอร์ในลิงก์
    const params = new URLSearchParams(window.location.search);
    const appParam = (params.get("app") || "").toLowerCase();
    const isDang = params.has("dang") || params.has("math") || appParam === "dang" || appParam === "math";
    const isClass = params.has("class") || appParam === "class";

    let targetUrl = SHABU_URL;
    if (isDang) {
      document.title = "SMART CLASSROOM 360° : คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล";
      document.body.style.backgroundColor = "#001838";
      targetUrl = DANG_URL;
    } else if (isClass) {
      document.title = "Aaron Smart Classroom";
      targetUrl = CLASS_URL;
    } else {
      document.title = "ชาบู - ระบบจัดการร้าน";
      targetUrl = SHABU_URL;
    }

    document.getElementById("appFrame").src = targetUrl + window.location.search;
  </script>
</body>
</html>
