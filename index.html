<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>ระบบจัดการ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #080f1d;
      font-family: 'Kanit', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .frame-wrapper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* ซ่อนแถบสีเทาด้านบนของ Google Apps Script อัตโนมัติกรณีเปิดผ่านโหมด Iframe สำรอง */
    iframe.crop-gas-bar {
      top: -68px;
      height: calc(100% + 68px);
    }
    @media (min-width: 768px) {
      iframe.crop-gas-bar {
        top: -54px;
        height: calc(100% + 54px);
      }
    }
  </style>
</head>
<body>
  <div class="frame-wrapper" id="frameWrap">
    <iframe id="appFrame" allow="autoplay; camera *; microphone *; clipboard-read; clipboard-write; display-capture"></iframe>
  </div>

  <script>
    // 1. URL ร้านชาบู
    const SHABU_URL = "https://script.google.com/macros/s/AKfycbynNg5wbR8JwHeumgDj44FDe7TCk0ESO3k5HJSRK0VNY5aRtCyEzTqUT9fATV-Vp9tm/exec";
    
    // 2. URL ห้องเรียน Aaron Smart Classroom
    const CLASS_URL = "https://script.google.com/macros/s/AKfycbwEJCEFJ5MU69n9R3MeHtQSYMGPRC2Gncma_G1DoFT9oco8uScv80vVXjOsuOuH4KaP/exec";

    // 3. URL ห้องเรียน Dang Smart Classroom (คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล)
    const DANG_URL = "https://script.google.com/macros/s/AKfycbzBR6_q49HMH7SnmhpipeTuWOa_8ddW0Q_tcuAFT2QqTr-ls6ljqTLvC92z8lVMydi1/exec";

    // 4. URL ระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4 (Quick and Easy Exam)
    const EXAM_URL = "https://script.google.com/macros/s/AKfycbygta_D0T2FB7_cWZTIcwjpvrFftBBhZiz8WJ9lnT-F-bILz3-DhG3gHTNqOy1_iP3dmw/exec";

    // ตรวจสอบพารามิเตอร์ในลิงก์
    const params = new URLSearchParams(window.location.search);
    const appParam = (params.get("app") || "").toLowerCase();
    const isExam = params.has("exam") || params.has("quiz") || params.has("test") || appParam === "exam" || appParam === "quiz";
    const isDang = params.has("dang") || params.has("math") || appParam === "dang" || appParam === "math";
    const isClass = params.has("class") || appParam === "class";

    function bootStandaloneShell(targetUrl, shellKey, expectedMarker, dataKey) {
      function writeShell(htmlStr) {
        document.open();
        document.write(htmlStr);
        document.close();
      }

      function fallbackToIframe() {
        const frame = document.getElementById("appFrame");
        if (frame) {
          frame.classList.add("crop-gas-bar");
          frame.src = targetUrl + window.location.search;
        }
      }

      function fetchAndCacheShell(isBackground) {
        fetch(targetUrl + "?action=standalone_html", { redirect: "follow" })
          .then(r => r.json())
          .then(res => {
            if (res && res.status === "SUCCESS" && res.html) {
              try { localStorage.setItem(shellKey, res.html); } catch (e) {}
              if (res.data && dataKey) {
                try {
                  window.__INITIAL_EXAM_DATA__ = res.data;
                  localStorage.setItem(dataKey, JSON.stringify(res.data));
                } catch (e) {}
              }
              if (!isBackground) {
                writeShell(res.html);
              }
            } else if (!isBackground) {
              fallbackToIframe();
            }
          })
          .catch(() => {
            if (!isBackground) {
              fallbackToIframe();
            }
          });
      }

      let cachedShell = null;
      try { cachedShell = localStorage.getItem(shellKey); } catch (e) {}

      if (cachedShell && cachedShell.includes(expectedMarker)) {
        // เปิดขึ้นหน้าจอทันทีใน 0.01 วินาทีโดยไม่ต้องรอโหลดจาก Google!
        setTimeout(() => fetchAndCacheShell(true), 1200);
        writeShell(cachedShell);
      } else {
        fetchAndCacheShell(false);
      }
    }

    if (isExam && !params.has("iframe")) {
      // ⚡ โหมด Standalone Zero-Iframe ความเร็วสูงสำหรับระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4
      document.title = "ระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4";
      document.body.style.backgroundColor = "#f0f4f9";
      bootStandaloneShell(EXAM_URL, "exam_standalone_shell_v1", "QUICK AND EASY EXAM SYSTEM", "exam_appdata_swr_v1");
    } else if (isDang && !params.has("iframe")) {
      // ⚡ โหมด Standalone Zero-Iframe ความเร็วสูงสำหรับ Dang Smart Classroom 360°
      document.title = "SMART CLASSROOM 360° : คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล";
      document.body.style.backgroundColor = "#001838";
      bootStandaloneShell(DANG_URL, "dang_standalone_shell_v1", "DANG SMART CLASSROOM");
    } else if (isClass && !params.has("iframe")) {
      // ⚡ โหมด Standalone Zero-Iframe ความเร็วสูงสำหรับ Aaron Smart Classroom
      document.title = "Aaron Smart Classroom";
      bootStandaloneShell(CLASS_URL, "aaron_standalone_shell_v1", "AARON SMART CLASSROOM");
    } else {
      let targetUrl = SHABU_URL;
      const frame = document.getElementById("appFrame");
      if (isExam) {
        document.title = "ระบบสอบออนไลน์ & จัดพิมพ์ข้อสอบมาตรฐาน F4";
        document.body.style.backgroundColor = "#f0f4f9";
        if (frame) frame.classList.add("crop-gas-bar");
        targetUrl = EXAM_URL;
      } else if (isDang) {
        document.title = "SMART CLASSROOM 360° : คณิตคิดสนุก ป.6 - ครูกมลพงษ์ วารีบาล";
        document.body.style.backgroundColor = "#001838";
        targetUrl = DANG_URL;
      } else if (isClass) {
        document.title = "Aaron Smart Classroom";
        targetUrl = CLASS_URL;
      } else {
        document.title = "ชาบู - ระบบจัดการร้าน";
        targetUrl = SHABU_URL;
      }
      if (frame) frame.src = targetUrl + window.location.search;
    }
  </script>
</body>
</html>
